(function(){

  const marksSnap=()=>{const m=read();return{exists:true,data:()=>m,metadata:{fromCache:false}}};
  const db={
    collection:()=>({onSnapshot:(next,err)=>{get("shelf.json").then(j=>next({docs:j.docs.map((d,i)=>({id:String(i),exists:true,data:()=>d})),metadata:{fromCache:false}})).catch(e=>err&&err(e));return()=>{}}}),

/* ─────────────────────────────────────────────────────────────
   LIFE SHELF · design system
   Direction: an index-card box you carry in your pocket.
   Layout: one-column phone app, built for a 384×824 viewport (Galaxy S23 Ultra).
   Reading on top, every action in the bottom third where the thumb is.
   Grid: 4pt base, 8pt rhythm. Every size, gap and line box is a multiple of 4.
   ───────────────────────────────────────────────────────────── */
:root{
  color-scheme:light;

  /* Color: neutral paper ramp, one ink accent, eight index-tab colors */
  --bg:#F6F5F2;          /* page */

  --line:rgba(26,25,22,.08);
  --line-2:rgba(26,25,22,.14);
  --ink:#1A1916;         /* primary text */
  --ink-2:#55514A;       /* secondary text */
  --ink-3:#6F6A62;       /* muted: meta and captions only */
  --accent:#2747C8;      /* ink blue: primary action, progress, selection */
  --accent-press:#1F39A3;
  --on-accent:#FFFFFF;
  --accent-soft:#E9EDFB;
  --good:#2F7D4F;

  --tab-attention:#C8641F;
  --tab-action:#2F7D4F;
  --tab-mind:#7B55BE;
  --tab-body:#1E8A84;
  --tab-people:#C2456C;
  --tab-time:#9A7415;
  --tab-money:#4F6684;
  --tab-learning:#8E5B2E;

  /* Type: Allo only. Sizes and line boxes (all line boxes on the 4pt grid) */
  --font:"Allo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  /* Space: 4pt scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s16:64px;
  --gutter:20px;

  /* Size */
  --tap:48px;            /* smallest touch target */
  --btn:52px;            /* primary buttons in the thumb zone */
  --tabbar:64px;
  --actionbar:76px;      /* 52 button + 12 + 12 */
  --col:480px;           /* the app column on wider screens */

  /* Radius: nested (inner = outer − padding, never under 4) */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-pill:999px;

  /* Elevation: light theme, neutral and small */

  --d-press:120ms;       /* press, toggles */
  --d-quick:180ms;       /* icon fills, color changes */
  --d-swap:240ms;        /* card swap, tab change */

.more{justify-self:start;height:var(--tap);margin:calc(var(--s3) * -1) 0;display:inline-flex;align-items:center;gap:var(--s1);color:var(--accent)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line);color:var(--ink-3)}
.card-foot a{display:inline-flex;align-items:center;gap:var(--s1);height:var(--tap);margin:calc(var(--s3) * -1) 0;text-decoration:none;color:var(--ink-2)}

.card.swap-out{animation:swapOut var(--d-swap) var(--ease) both}

/* Action bar: lives in the thumb zone, above the tab bar */

  transition:transform var(--d-press) var(--ease),background-color var(--d-quick) var(--ease),color var(--d-quick) var(--ease),box-shadow var(--d-quick) var(--ease)}

.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--s3);width:100%;min-height:64px;padding:var(--s3) var(--s4);text-align:left;

/* Segmented control */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:var(--s1);gap:var(--s1);background:var(--raised);border-radius:var(--r-md)}
.seg button{height:40px;border-radius:var(--r-sm);color:var(--ink-2);transition:background-color var(--d-quick) var(--ease),color var(--d-quick) var(--ease)}

/* Try list */

.try .open .s{color:var(--ink-3)}

.done .copy{display:grid;gap:var(--s2)}
.done .copy p{color:var(--ink-2)}
.done .btns{display:grid;gap:var(--s2)}
.week{display:grid;gap:var(--s3)}
.week .days{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s2)}
.week .d{display:grid;justify-items:center;gap:var(--s1);color:var(--ink-3)}

.week .d.today{color:var(--ink)}
.week .d.today i{box-shadow:inset 0 0 0 1.5px var(--accent)}

.upnext{display:grid;gap:var(--s2);padding:0 var(--s1)}
.un-row{display:grid;grid-template-columns:8px minmax(0,1fr);gap:var(--s3);align-items:center;color:var(--ink-3)}
.un-row i{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--th) 60%,var(--bg))}
.un-row span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* Notes, empty states, footer meta */
.note{color:var(--ink-3)}
.empty{padding:var(--s8) var(--s6);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--e-1);display:grid;gap:var(--s2);text-align:left}
.empty p{color:var(--ink-2)}
.meta{color:var(--ink-3);display:grid;gap:var(--s1)}

/* Reader sheet (opened from any list) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(100%);transition:transform var(--d-sheet) var(--ease);visibility:hidden}

  padding-top:env(safe-area-inset-top,0px)}
.sheet-top-in{max-width:var(--col);margin:0 auto;height:56px;display:grid;grid-template-columns:var(--tap) 1fr var(--tap);align-items:center;
  padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}

      return h("button",{class:"row",style:`--th:var(--tab-${k})`,onclick:()=>{route={name:"theme",th:k};shelfShowAll=false;go("shelves",true)}},
        h("i",{class:"bar","aria-hidden":"true"}),
        h("span",{class:"txt"},h("span",{class:"tline"},h("span",{class:"t-head"},T.label),h("span",{class:"count t-caption num"},u?u+" unread":"All read")),h("span",{class:"s t-caption"},T.note)),
        h("span",{class:"end"},icon("right","i i-sm")))})));
    if(loaded)kids.push(h("div",{class:"meta t-caption"},
      h("p",{},`Updated ${fmtDay(meta.last_run)}${meta.next_run?" · next refresh "+fmtDay(meta.next_run):""}`),
      h("p",{class:"num"},`${posts.length} life posts from ${meta.total_bookmarks?meta.total_bookmarks.toLocaleString():"your"} bookmarks. Design posts are left out.`)));
  }
  return kids;
}
function viewTheme(k){
  const T=THEMES[k]||{label:k,note:""};
  const all=posts.filter(p=>p.th===k),unread=all.filter(p=>!mk(p.id));
  const list=shelfShowAll?all:unread;
  return [
    h("div",{},h("button",{class:"back t-label",onclick:()=>{route={name:"home"};go("shelves",true)}},icon("left"),"Shelves"),
      h("header",{class:"hd",style:"padding-top:8px"},h("h1",{class:"t-display"},T.label),h("p",{class:"sub t-body"},T.note))),
    h("div",{class:"seg",role:"group","aria-label":"Show"},
      h("button",{class:"t-label","aria-pressed":String(!shelfShowAll),onclick:()=>{shelfShowAll=false;render()}},`Unread ${unread.length}`),
      h("button",{class:"t-label","aria-pressed":String(shelfShowAll),onclick:()=>{shelfShowAll=true;render()}},`All ${all.length}`)),
    list.length?h("div",{class:"group",style:`--th:var(--tab-${k})`},list.map(p=>postRow(p,list))):emptyCard("All read here","Switch to All to read them again.")];
}
function viewTry(){
  const pr=posts.filter(p=>p.pr),n=pr.filter(p=>mk(p.id)==="tried").length;
  const kids=[header(null,"Try this",loaded?`${n} of ${pr.length} tried`:"Loading")];
  if(loaded&&pr.length)kids.push(h("div",{class:"meter","aria-hidden":"true"},h("i",{style:`transform:scaleX(${pr.length?n/pr.length:0})`})));
  kids.push(h("p",{class:"note t-body",style:"color:var(--ink-2)"},"Small things the posts tell you to do. Pick one, try it once, tick it off."));
  if(pr.length)kids.push(h("div",{class:"group"},pr.map(p=>{const on=mk(p.id)==="tried";
    return h("div",{class:"try"+(on?" on":"")},
      h("button",{class:"check","aria-pressed":String(on),"aria-label":(on?"Tried: ":"Mark tried: ")+(p.pl||"practice"),onclick:()=>toggleMark(p.id,"tried")},h("span",{},icon("check"))),
      h("button",{class:"open",onclick:()=>openSheet(pr.map(x=>x.id),pr.indexOf(p))},h("span",{class:"t-head"},p.pl||clean(p.t).slice(0,48)),h("span",{class:"s t-caption"},th(p).label+" · @"+p.h)))})));
  return kids;
}
function viewKept(){
  const list=posts.filter(p=>mk(p.id)==="kept").sort((a,b)=>marks[b.id].t-marks[a.id].t);
  const kids=[header(null,"Kept",list.length?`${list.length} worth coming back to`:"Posts you want to keep close")];
  kids.push(list.length?h("div",{class:"group"},list.map(p=>postRow(p,list,{showTheme:true}))):emptyCard("Nothing kept yet","Tap the bookmark under a post to keep it here."));
  return kids;
}

/* ───────── reader sheet ───────── */
function openSheet(ids,idx){sheet={ids,idx};const s=$("sheet");s.classList.add("open");s.setAttribute("aria-hidden","false");s.scrollTop=0;
  try{history.pushState({sheet:1},"")}catch(e){}renderSheet("");document.body.style.overflow="hidden";$("todayBar").hidden=true}
function closeSheet(fromPop){if(!sheet)return;sheet=null;const s=$("sheet");s.classList.remove("open");s.setAttribute("aria-hidden","true");document.body.style.overflow="";
  if(!fromPop){try{history.back()}catch(e){}}render()}
window.addEventListener("popstate",()=>{if(sheet)closeSheet(true)});
$("sheetClose").addEventListener("click",()=>closeSheet());
function renderSheet(anim){
  if(!sheet)return;const p=byId.get(sheet.ids[sheet.idx]);if(!p){closeSheet();return}
  $("sheetPos").textContent=`${sheet.idx+1} of ${sheet.ids.length}`;
  $("sheetBody").replaceChildren(postCard(p,{animate:anim}));
  const last=sheet.idx>=sheet.ids.length-1;
  $("sheetBarIn").replaceChildren(...actionButtons(p,{high:true,
    onPrev:sheet.idx>0?()=>{sheet.idx--;$("sheet").scrollTop=0;renderSheet("swap-back")}:null,
    nextLabel:last?"Done":"Done, next",
    onNext:()=>{if(!mk(p.id))setMark(p.id,"read");buzz();if(last){closeSheet();return}sheet.idx++;$("sheet").scrollTop=0;renderSheet("swap-in")}}));
}

/* Swipe between cards (Today and the sheet). Horizontal only, ignores vertical scroll. */
function swipe(el,onLeft,onRight){let x0=0,y0=0,t0=0,on=false;
  el.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();on=true},{passive:true});
  el.addEventListener("touchend",e=>{if(!on)return;on=false;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-t0<600){dx<0?onLeft():onRight()}},{passive:true})}
swipe($("view"),()=>{if(tab==="today"&&!sheet){const b=$("todayBarIn").querySelector(".btn-primary");b&&b.click()}},()=>{if(tab==="today"&&todayIdx>0){todayIdx--;swapAnim="swap-back";render()}});
swipe($("sheetBody"),()=>{const b=$("sheetBarIn").querySelector(".btn-primary");b&&b.click()},()=>{if(sheet&&sheet.idx>0){sheet.idx--;renderSheet("swap-back")}});

/* ───────── tabs + render ───────── */
const TABS=[["today","Today","today"],["shelves","Shelves","shelves"],["try","Try","try"],["kept","Kept","keep"]];
function go(t,keepRoute){if(t!==tab&&!keepRoute)route={name:"home"};if(t==="shelves"&&tab==="shelves"&&!keepRoute)route={name:"home"};tab=t;ls.set("tab",t);lastView="";window.scrollTo(0,0);render()}
function renderTabs(){
  $("tabs").replaceChildren(...TABS.map(([k,l,ic])=>h("button",{"aria-current":tab===k?"page":null,onclick:()=>go(k)},
    h("span",{class:"pill"},icon(ic)),h("span",{class:"t-micro"},l))));
}
function render(){
  const key=tab+"|"+(route.name==="theme"?route.th:"")+"|"+loaded;
  const v=$("view");
  const kids=tab==="today"?viewToday():tab==="shelves"?viewShelves():tab==="try"?viewTry():viewKept();
  v.classList.toggle("enter",key!==lastView);lastView=key;
  v.replaceChildren(...kids);swapAnim="";
  renderTabs();todayBar();
  if(sheet)renderSheet("");
  document.documentElement.classList.toggle("grid-on",location.hash==="#grid");
}
window.addEventListener("hashchange",render);

/* ───────── boot ───────── */
render();
(async()=>{
  db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  if(!db){dbState="none";render();return}
  const timer=setTimeout(()=>{if(!loaded){dbState="slow";toast("Still loading. Check your connection")}},10000);
  db.collection("shelf").onSnapshot(s=>{
    posts=s.docs.flatMap(d=>(d.data().posts||[])).sort((a,b)=>(b.b||"").localeCompare(a.b||"")||(a.pos-b.pos));
    byId=new Map(posts.map(p=>[p.id,p]));
    if(!s.metadata.fromCache){loaded=true;clearTimeout(timer)}else if(posts.length)loaded=true;
    render()},()=>{loaded=true;clearTimeout(timer);toast("Couldn't load the shelf. Reopen the page");render()});
  db.doc("marks/main").onSnapshot(d=>{const x=d.exists?d.data():{};marks={...(x.items||{})};days={...(x.days||{})};marksLoaded=true;render()},()=>{marksLoaded=true;render()});
  db.doc("meta/main").onSnapshot(d=>{meta=d.exists?d.data():{};render()},()=>{});
})();
</script>
